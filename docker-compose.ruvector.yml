# docker-compose.ruvector.yml
# Memibrium with RuVector-postgres (Phase 2.5)
# Usage: docker compose -f docker-compose.ruvector.yml up -d
#
# First `up` pulls the Ollama models listed in OLLAMA_MODELS (one-shot `ollama-pull` service); the server
# starts only after that pull succeeds, because its startup check embeds a probe string.
# Watch progress with: docker compose -f docker-compose.ruvector.yml logs -f ollama-pull
#
# RuVector-postgres is a drop-in pgvector replacement with:
#   - GNN re-ranking (attention over HNSW candidates, <1ms)
#   - SONA self-learning (query patterns improve results over time)
#   - Same SQL operators, same vector(N) type, same index syntax
#   - https://github.com/ruvnet/ruvector
#
# Embedding width: nomic-embed-text returns 768 dimensions, so EMBEDDING_DIM defaults to 768 here. It fixes the
# width of memories.embedding when the table is created; switching models later needs a new database (or
# reembed.py), not just a new value.

services:
  ruvector-db:
    image: ruvnet/ruvector-postgres:2.0.5
    container_name: memibrium-ruvector-db
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
    ports:
      - "5432:5432"
    volumes:
      - ruvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.13
    container_name: memibrium-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: pulls every model the server is configured to call, then exits 0. Re-running is cheap: models
  # already in the ollama_data volume are verified, not downloaded again.
  ollama-pull:
    image: ollama/ollama:0.40.13
    container_name: memibrium-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELS_TO_PULL: ${OLLAMA_MODELS:-nomic-embed-text gemma4:e4b phi3:mini}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for m in $$OLLAMA_MODELS_TO_PULL; do
          echo "pulling $$m"
          ollama pull "$$m"
        done
        echo "models ready: $$OLLAMA_MODELS_TO_PULL"
    restart: "no"

  memibrium:
    build: .
    container_name: memibrium-server
    depends_on:
      ruvector-db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      # Local embeddings and chat via Ollama. The clients send no real API key (MED-253), so these must be
      # keyless OpenAI-compatible endpoints.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      OLLAMA_CHAT_BASE: ${OLLAMA_CHAT_BASE:-http://ollama:11434/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:e4b}
      SLM_MODEL: ${SLM_MODEL:-phi3:mini}
      SLM_BASE_URL: ${SLM_BASE_URL:-http://ollama:11434/v1}
      DB_HOST: ruvector-db
      DB_PORT: "5432"
      DB_NAME: memory
      DB_USER: memory
      DB_PASSWORD: memory
      USE_RUVECTOR: ${USE_RUVECTOR:-true}
      RUVECTOR_GNN: ${RUVECTOR_GNN:-true}
      ENABLE_BACKGROUND_SCORING: ${ENABLE_BACKGROUND_SCORING:-true}
      ENABLE_CONTRADICTION_DETECTION: ${ENABLE_CONTRADICTION_DETECTION:-true}
      ENABLE_HIERARCHY_PROCESSING: ${ENABLE_HIERARCHY_PROCESSING:-true}
    volumes:
      - .:/app
    ports:
      - "9999:9999"
    restart: unless-stopped

volumes:
  ruvector_data:
  ollama_data:
