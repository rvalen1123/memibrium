name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memibrium
          POSTGRES_PASSWORD: memibrium
          POSTGRES_DB: memibrium_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memibrium"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Taxonomy tests (40 tests)
        run: python test_taxonomy.py

      - name: Ingest unit tests (34 tests)
        run: python test_ingest_unit.py
      - name: Idempotent retain (unit + migration against Postgres)
        env:
          MEMIBRIUM_TEST_DSN: postgresql://memibrium:memibrium@localhost:5432/memibrium_test
        run: python test_retain_idempotency.py
